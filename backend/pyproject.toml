[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "resume-radar-backend"
version = "0.1.0"
description = "ResumeRadar backend: resume parsing, ATS simulation and role intelligence."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pgvector>=0.2",
  "python-multipart>=0.0.9",
  "pypdf>=4.2",
  "python-docx>=1.1",
  "httpx>=0.27",
  "praw>=7.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "reportlab>=4.2",
  "ruff>=0.5",
  "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"
